<nav class="navbar bg-white shadow-lg px-4 py-3 d-flex justify-content-between align-items-center "
 [class.navbar-hidden]="!showNavbar">

    <!-- Left -->
    <div class="d-flex align-items-center gap-3">

        <button
            class="btn border-0 d-flex align-items-center rounded-2xl justify-content-center"
            style="width: 45px; height: 45px; background-color: #EEF4FF;"
            (click)="toggleMenu()">

            <i class="fa-solid fa-bars "></i>

        </button>

        <span class="text-secondary small">
            Welcome Back  👋
        </span>
        <!-- <span class="text-2xl font-medium">
          {{ userName }}
        </span> -->

    </div>


    <!-- Right / Profile -->
    <div class="d-flex align-items-center gap-3 px-3 py-2 rounded-xl bg-white shadow-xl">

        <div
            class="d-flex align-items-center justify-content-center rounded-2xl fw-semibold"
            style="width: 42px; height: 42px; background-color: #EEF4FF; color: #2563EB;">

            {{ firstLetter }}

        </div>

        <div>
            <h6 class="mb-0 fw-semibold">
                {{ userName }}
            </h6>
        </div>

    </div>

</nav>
