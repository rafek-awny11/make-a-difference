<section class="min-h-screen bg-slate-100 p-4 md:p-6">

  <!-- Main Card -->
  <div
    class="bg-white border border-slate-200
           shadow-sm rounded-2xl overflow-hidden"
  >

    <!-- ================= Header ================= -->
    <div
      class="p-5 md:p-6 border-b border-slate-200
             flex items-center gap-4"
    >

      <!-- Icon -->
      <div
        class="w-12 h-12 rounded-xl bg-purple-100
               flex items-center justify-center shrink-0"
      >
        <i class="fa-solid fa-calendar-plus text-blue-600 text-xl"></i>
      </div>


      <!-- Title -->
      <div>

        <h1 class="text-xl md:text-2xl font-bold text-slate-800 mb-0">
          Create Meeting
        </h1>

        <p class="text-sm text-slate-500 mt-1 mb-0">
          Add a new meeting to an event
        </p>

      </div>

    </div>


    <!-- ================= Form ================= -->
    <form
      [formGroup]="creatForm"
      (ngSubmit)="creatMeeting()"
    >

      <div class="p-5 md:p-6">

        <!-- Form Fields -->
        <div
          class="grid grid-cols-1
                 md:grid-cols-2
                 xl:grid-cols-3
                 gap-5"
        >

          <!-- Event Name -->
          <div>

            <label
              class="block mb-2
                     text-sm font-semibold text-slate-700"
            >
              Event Name
            </label>

            <div class="relative">

              <i
                class="fa-solid fa-calendar-days
                       absolute left-4 top-1/2
                       -translate-y-1/2
                       text-slate-400
                       pointer-events-none"
              ></i>

              <select
                formControlName="eventId"
                class="w-full h-12
                       border border-slate-300
                       rounded-xl
                       bg-white
                       pl-11 pr-4
                       text-sm text-slate-700
                       focus:outline-none
                       focus:ring-2 focus:ring-blue-600
                       focus:border-blue-600"
              >

                <option value="" disabled>
                  Select Event
                </option>

                <option
                  *ngFor="let event of event"
                  [value]="event.id"
                >
                  {{ event.name }}
                </option>

              </select>

            </div>

          </div>


          <!-- Meeting Name -->
          <div>

            <label
              class="block mb-2
                     text-sm font-semibold text-slate-700"
            >
              Meeting Name
            </label>

            <div class="relative">

              <i
                class="fa-solid fa-users
                       absolute left-4 top-1/2
                       -translate-y-1/2
                       text-slate-400"
              ></i>

              <input
                formControlName="name"
                type="text"
                placeholder="Enter meeting name"
                class="w-full h-12
                       border border-slate-300
                       rounded-xl
                       bg-white
                       pl-11 pr-4
                       text-sm text-slate-700
                       focus:outline-none
                       focus:ring-2 focus:ring-blue-600
                       focus:border-blue-600"
              />

            </div>

          </div>


          <!-- Meeting Time -->
          <div>

            <label
              class="block mb-2
                     text-sm font-semibold text-slate-700"
            >
              Meeting Time
            </label>

            <input
              formControlName="meetingTime"
              type="datetime-local"
              class="w-full h-12
                     border border-slate-300
                     rounded-xl
                     bg-white
                     px-4
                     text-sm text-slate-700
                     focus:outline-none
                     focus:ring-2 focus:ring-blue-600
                     focus:border-blue-600"
            />

          </div>

        </div>

      </div>


      <!-- ================= Footer ================= -->
      <div
        class="px-5 md:px-6 py-4
               bg-slate-50
               border-t border-slate-200
               flex flex-col-reverse sm:flex-row
               sm:justify-end gap-3"
      >

        <!-- Back -->
        <button
          type="button"
          [routerLink]="'/meeting'"
          class="btn btn-light border
                 rounded-4 px-4 py-2
                 d-flex align-items-center
                 justify-content-center gap-2"
        >

          <i class="fa-solid fa-arrow-left"></i>

          Back to List

        </button>


        <!-- Create -->
        <button
          type="submit"
          class="btn btn-primary
                 rounded-4 px-4 py-2
                 d-flex align-items-center
                 justify-content-center gap-2"
        >

          @if (isLoading) {

            <i class="fas fa-spinner animate-spin"></i>

            <span>
              Creating...
            </span>

          } @else {

            <i class="fa-solid fa-plus"></i>

            <span>
              Create Meeting
            </span>

          }

        </button>

      </div>

    </form>

  </div>

</section>
