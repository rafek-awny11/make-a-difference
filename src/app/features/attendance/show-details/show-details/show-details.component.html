
<section class="min-h-screen bg-slate-100 p-4 md:p-6">

  <!-- ================= Header ================= -->
  <div
    class="bg-white border border-slate-200 shadow-sm rounded-2xl
           p-5 md:p-6 mb-6"
  >

    <div
      class="flex flex-col md:flex-row
             md:items-center md:justify-between gap-4"
    >

      <!-- Title -->
      <div class="flex items-center gap-4">

        <!-- Icon -->
        <div
          class="w-12 h-12 rounded-xl bg-blue-100
                 flex items-center justify-center shrink-0"
        >
          <i class="fa-solid fa-clipboard-list text-blue-600 text-xl"></i>
        </div>

        <div>
          <h1 class="text-xl md:text-2xl font-bold text-slate-800">
            Attendance Report
          </h1>

          <p class="text-sm text-slate-500 mt-1">
            View and filter attendance records for this event
          </p>
        </div>

      </div>


     

    </div>

  </div>


  <!-- ================= Filters ================= -->
  <div
    class="bg-white border border-slate-200 shadow-sm
           rounded-2xl p-5 md:p-6 mb-6"
  >

    <div
      class="grid grid-cols-1
             md:grid-cols-2 xl:grid-cols-4
             gap-5 items-end"
    >

      <!-- Meeting -->
      <div class="xl:col-span-1">

        <label
          class="flex items-center gap-2
                 mb-2 text-sm font-semibold text-slate-700"
        >
          <i class="fa-solid fa-users text-blue-600"></i>
          Select Meeting
        </label>

        <select
          [(ngModel)]="meetingId"
          class="w-full border border-slate-300
                 rounded-xl px-4 py-3
                 bg-white text-slate-700
                 focus:outline-none
                 focus:ring-2 focus:ring-blue-500
                 focus:border-blue-500"
        >

          <option [ngValue]="null">
            All Meeting
          </option>

          <option
            *ngFor="let meeting of filteredMeetings"
            [ngValue]="meeting.id"
          >
            {{ meeting.name }}
          </option>

        </select>

      </div>


      <!-- Student Phone -->
      <div class="xl:col-span-1">

        <label
          class="flex items-center gap-2
                 mb-2 text-sm font-semibold text-slate-700"
        >
          <i class="fa-solid fa-phone text-blue-600"></i>
          Student Phone
        </label>

        <div class="relative">

          <i
            class="fa-solid fa-phone
                   absolute left-4 top-1/2
                   -translate-y-1/2
                   text-slate-400"
          ></i>

          <input
            type="text"
            [(ngModel)]="studentPhone"
            placeholder="Enter phone number"
            class="w-full border border-slate-300
                   rounded-xl
                   py-3 pl-11 pr-4
                   text-slate-700
                   focus:outline-none
                   focus:ring-2 focus:ring-blue-500
                   focus:border-blue-500"
          />

        </div>

      </div>



<!-- Export Excel -->
<div>
  <button
    type="button"
    (click)="exportAttendanceExcel()"
    class="btn btn-success w-100 rounded-4 py-2 px-4
           d-flex align-items-center justify-content-center gap-2"
  >
    <i class="fa-solid fa-file-excel"></i>
    <span>Export Excel</span>
  </button>
</div>


<!-- Show All -->
<div>
  <button
    type="button"
    (click)="showAttendance()"
    class="btn btn-primary w-100 rounded-4 py-2 px-4
           d-flex align-items-center justify-content-center gap-2"
  >
    <i class="fa-solid fa-table-list"></i>
    <span>Show All</span>
  </button>
</div>



    </div>

  </div>


  <!-- ==================================================
       Attendance Table
       Hidden until Show All is clicked
  =================================================== -->
  <div
    *ngIf="showTable"
    class="bg-white border border-slate-200
           shadow-sm rounded-2xl overflow-hidden mb-6"
  >

    <!-- Table Header -->
    <div
      class="p-5 md:p-6
             border-b border-slate-200
             flex flex-col sm:flex-row
             sm:items-center sm:justify-between
             gap-4"
    >

      <div class="flex items-center gap-3">

        <div
          class="w-10 h-10 rounded-xl bg-blue-100
                 flex items-center justify-center"
        >
          <i class="fa-solid fa-clipboard-check text-blue-600"></i>
        </div>

        <div>

          <h2 class="text-lg font-bold text-slate-800">
            Attendance List
          </h2>

          <p class="text-sm text-slate-500">
            Showing attendance records based on your selection
          </p>

        </div>

      </div>


      <!-- Total -->
      <div
        class="bg-blue-100 text-blue-700
               px-4 py-2 rounded-full
               text-sm font-semibold
               self-start sm:self-auto"
      >
        Total: {{ eventList.length }}
      </div>

    </div>


    <!-- Table -->
    <div class="overflow-x-auto">

      <table class="w-full text-sm text-left">

        <thead
          class="bg-slate-100
                 text-slate-700
                 border-b border-slate-200"
        >

          <tr>

            <th class="px-6 py-4 font-semibold">
              #
            </th>

            <th class="px-6 py-4 font-semibold">
              <div class="flex items-center gap-2">
                <i class="fa-solid fa-user text-slate-600"></i>
                Name
              </div>
            </th>

            <th class="px-6 py-4 font-semibold">
              <div class="flex items-center gap-2">
                <i class="fa-regular fa-clock text-slate-600 font-sans"></i>
                وقت الخدمة
              </div>
            </th>

            <th class="px-6 py-4 font-semibold">
              <div class="flex items-center gap-2">
                <i class="fa-regular fa-clock text-slate-600 font-sans"></i>
                وقت الحضور
              </div>
            </th>

          </tr>

        </thead>


        <tbody>

          <tr
            *ngFor="let item of eventList; let i = index"
            class="border-b border-slate-200
                   last:border-b-0
                   hover:bg-slate-50
                   transition"
          >

            <!-- Number -->
            <td class="px-6 py-4 text-slate-500">
              {{ i + 1 }}
            </td>


            <!-- Student -->
            <td
              class="px-6 py-4
                     font-medium text-slate-800
                     whitespace-nowrap"
            >
              {{ item.studentName }}
            </td>


            <!-- Meeting Time -->
            <td
              class="px-6 py-4
                     text-slate-700 whitespace-nowrap"
            >
              {{ item.meeting.meetingTime }}
            </td>


            <!-- Attendance Time -->
            <td
              class="px-6 py-4
                     text-slate-700 whitespace-nowrap"
            >
              {{ item.attendanceTime }}
            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>


  <!-- ================= Back ================= -->
  <div class="flex justify-start">

    <button
      type="button"
      [routerLink]="['/details', eventName, id]"
      class="btn px-5 py-2.5
             rounded-xl
             border border-slate-300
             bg-white text-slate-700
             font-medium
             flex items-center gap-2"
    >

      <i class="fa-solid fa-arrow-left"></i>

      Back to Event

    </button>

  </div>

</section>
```
