<section class="min-vh-100 py-3 py-md-5 bg-light">


  

  <div class="container">

    <!-- Main Page Card -->
    <div class="mx-auto overflow-hidden shadow rounded-4 bg-white" style="max-width: 850px;">

      <div class="p-3 p-md-5">

        <!-- ========================= -->
        <!-- Student Card -->
        <!-- ========================= -->

        <div
          #cardRef
  data-card-ref="student-card"
  class="border rounded-4 p-3 p-md-4 mb-4 mx-auto bg-white"
  style="max-width: 600px;"
        >

          <!-- ========================= -->
          <!-- Student Information -->
          <!-- ========================= -->

          <div class="border rounded-4 p-3 p-md-4 mb-4 bg-light">

            <!-- Student Name -->

           <div class="d-flex align-items-center gap-3 mb-4">

  <div
    class="rounded-circle d-flex align-items-center justify-content-center shrink-0"
    style="
      width: 50px;
      height: 50px;
      background-color: #e1f0ff;
    "
  >
    <i
      class="fa-solid fa-user-graduate"
      style="color: #0d6efd; font-size: 20px;"
    ></i>
  </div>

  <div class="text-start grow" style="min-width: 0;">

    <div
      class="small mb-1"
      style="color: #6c757d;"
    >
      Student Name
    </div>

    <div
      class="fw-bold fs-5 text-break"
      style="
        color: #212529;
        line-height: 1.5;
        padding-bottom: 2px;
      "
    >
      {{ student.name }}
    </div>

  </div>

</div>


            <!-- Phone -->

           <div class="d-flex align-items-center gap-3">

  <div
    class="rounded-circle d-flex align-items-center justify-content-center shrink-0"
    style="
      width: 50px;
      height: 50px;
      background-color: #e1f0ff;
    "
  >
    <i
      class="fa-solid fa-phone"
      style="color: #0d6efd; font-size: 19px;"
    ></i>
  </div>

  <div class="text-start grow" style="min-width: 0;">

    <div
      class="small mb-1"
      style="color: #6c757d;"
    >
      Phone
    </div>

    <div
      class="fw-bold fs-5 text-break"
      style="
        color: #212529;
        line-height: 1.5;
        padding-bottom: 2px;
      "
    >
      {{ student.phoneNo }}
    </div>

  </div>

</div>
          </div>
          <!-- QR Code -->
          <div
           
            class="border rounded-4 p-3 p-md-4 text-center bg-light"
             style="
    max-width: 600px;
    background-color: #ffffff;
    overflow: visible;
  "
          >

            <!-- QR Title -->

            <div class="mb-3">

              <h5 class="fw-bold mb-1 text-dark">
                Student QR Code
              </h5>

              <p class="small mb-0 text-secondary">
                Scan this QR code for student information
              </p>

            </div>


            <!-- QR -->
             <div
              #BarcodeOnlyRef>
              @if (isBrowser) {

             

                <div class="flex justify-center">

    <qrcode
      [qrdata]="(student.barcodeId ?? student.id).toString()"
      [width]="256"
    ></qrcode>

  </div>

              

            }

             </div>
            

          </div>

        </div>


        <!-- ===================================== -->
        <!-- Buttons -->
        <!-- ===================================== -->

        <div class="row g-3">


          <!-- Back -->

          <div class="col-6 col-md-3">

            <button
              [routerLink]="'/student'"
              type="button"
              class="btn btn-light border w-100 rounded-4 p-3 shadow-sm d-flex flex-column align-items-center justify-content-center gap-2"
            >

              <i class="fa-solid fa-arrow-left text-primary fs-4"></i>

              <span class="fw-semibold text-dark">
                Back
              </span>

            </button>

          </div>


          <!-- Full Card -->

          <div class="col-6 col-md-3">

            <button
              (click)="saveFullCard(cardRef, student.name)"
              type="button"
              class="btn btn-light border w-100 rounded-4 p-3 shadow-sm d-flex flex-column align-items-center justify-content-center gap-2"
            >

              <i class="fa-solid fa-download text-primary fs-4"></i>

              <span class="fw-semibold text-dark">
                Full Card
              </span>

            </button>

          </div>


          <!-- Barcode -->

          <div class="col-6 col-md-3">

            <button
              (click)="saveBarcodeOnly(BarcodeOnlyRef, student.name)"
              type="button"
              class="btn btn-light border w-100 rounded-4 p-3 shadow-sm d-flex flex-column align-items-center justify-content-center gap-2"
            >

              <i class="fa-solid fa-qrcode text-success fs-4"></i>

              <span class="fw-semibold text-dark">
                Barcode
              </span>

            </button>

          </div>


          <!-- Edit -->

          <div class="col-6 col-md-3">

            <button
              [routerLink]="['/update', student.name, student.id]"
              type="button"
              class="btn btn-light border w-100 rounded-4 p-3 shadow-sm d-flex flex-column align-items-center justify-content-center gap-2"
            >

              <i class="fa-solid fa-pen-to-square text-warning fs-4"></i>

              <span class="fw-semibold text-dark">
                Edit
              </span>

            </button>

          </div>


        </div>

      </div>

    </div>

  </div>

</section>
