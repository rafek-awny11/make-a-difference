<section class="min-h-screen bg-slate-100 p-4 md:p-8">

  <div class="max-w-7xl mx-auto">

    <!-- ================= HEADER ================= -->
    <div
      class="bg-white border border-slate-200
             shadow-sm rounded-2xl
             p-5 md:p-6 mb-6"
    >

      <div
        class="flex flex-col md:flex-row
               md:items-center md:justify-between
               gap-4"
      >

        <!-- Event Info -->
        <div class="flex items-center gap-3">

          <!-- Icon -->
          <div
            class="w-12 h-12
                   rounded-xl
                   bg-blue-50
                   border border-blue-100
                   flex items-center justify-center
                   shrink-0"
          >
            <i class="fa-solid fa-calendar-days text-blue-600 text-xl"></i>
          </div>

          <!-- Text -->
          <div>

            <p class="text-sm font-medium text-slate-500 mb-1">
              Event Details
            </p>

            <h1
              class="text-xl md:text-2xl
                     font-bold
                     text-slate-900"
            >
              {{ eventData?.name }}
            </h1>

          </div>

        </div>


        <!-- Export Excel -->
       <button
  type="button"
  (click)="goToPage()"
  class="btn btn-outline-success px-4 rounded-2xl!"
>
  <i class="fa-solid fa-file-excel me-2"></i>
<span class="font-medium ">
    Export Excel

</span></button>
      </div>

    </div>


    <!-- ================= STUDENTS ================= -->

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

      <!-- ================= AVAILABLE STUDENTS ================= -->

      <app-availabel
        class="block"
        (studentAdded)="onStudentAdded($event)"
        [refreshTrigger]="refreshAvailable"
      >
      </app-availabel>


      <!-- ================= CURRENT STUDENTS ================= -->

      <div
        class="bg-white
               border border-slate-200
               shadow-sm
               rounded-2xl
               overflow-hidden"
      >

        <!-- Card Header -->
        <div class="p-5 border-b border-slate-200">

          <div class="flex items-center gap-3">

            <!-- Icon -->
            <div
              class="w-12 h-12
                     rounded-xl
                     bg-emerald-50
                     border border-emerald-100
                     flex items-center justify-center"
            >
              <i
                class="fa-solid fa-user-check
                       text-emerald-600 text-lg"
              ></i>
            </div>


            <!-- Text -->
            <div>

              <h2
                class="text-lg
                       font-bold
                       text-slate-900"
              >
                Current Students
              </h2>

              <p
                class="text-sm
                       font-medium
                       text-slate-500"
              >
                Students currently added to this event
              </p>

            </div>

          </div>

        </div>


        <!-- ================= CONTENT ================= -->

        <div class="p-5">


          <!-- ================= CONTROLS ================= -->

          <div
            class="flex flex-col sm:flex-row
                   sm:items-center
                   sm:justify-between
                   gap-4 mb-5"
          >


            <!-- Entries -->

            <div class="flex items-center gap-3">

              <select
                [(ngModel)]="currentEntries"
                name="currentEntries"
                class="h-10
                       min-w-20
                       px-3
                       bg-white
                       border border-slate-300
                       rounded-xl
                       text-sm
                       font-semibold
                       text-slate-700
                       shadow-sm
                       outline-none
                       cursor-pointer
                       focus:border-blue-500
                       focus:ring-4
                       focus:ring-blue-100
                       transition"
              >

                <option
                  *ngFor="let e of [5, 10, 15, 20]"
                  [ngValue]="e"
                >
                  {{ e }}
                </option>

              </select>

              <span
                class="text-sm
                       font-medium
                       text-slate-500"
              >
                entries
              </span>

            </div>


            <!-- ================= SEARCH ================= -->

            <div class="relative w-full sm:w-64">

              <i
                class="fa-solid fa-magnifying-glass
                       absolute
                       left-3.5
                       top-1/2
                       -translate-y-1/2
                       text-slate-400
                       text-sm
                       pointer-events-none"
              ></i>

              <input
                type="text"
                placeholder="Search student..."
                [(ngModel)]="currentSearch"
                name="currentSearch"
                class="w-full
                       h-10
                       bg-white
                       border border-slate-300
                       rounded-xl
                       pl-10 pr-4
                       text-sm
                       font-medium
                       text-slate-700
                       placeholder:text-slate-400
                       shadow-sm
                       outline-none
                       focus:border-blue-500
                       focus:ring-4
                       focus:ring-blue-100
                       transition"
              />

            </div>

          </div>


          <!-- ================= TABLE ================= -->
<!-- Table -->
<div class="border border-slate-200 rounded-xl overflow-hidden">

  <table class="w-full table-fixed text-sm">

    <thead class="bg-slate-50">

      <tr class="border-b border-slate-200">

        <th
          class="w-[45%] text-left
                 px-4 py-3
                 font-semibold text-slate-600"
        >
          Student Name
        </th>

        <th
          class="w-[35%] text-left
                 px-3 py-3
                 font-semibold text-slate-600"
        >
          Phone
        </th>

        <th
          class="w-[20%] text-center
                 px-2 py-3
                 font-semibold text-slate-600"
        >
          Select
        </th>

      </tr>

    </thead>


    <tbody>

      <tr
        *ngFor="
          let student of
          ((currentStudents || []) | search:currentSearch)
          .slice(0, currentEntries)
        "
        class="border-b border-slate-100
               last:border-0
               hover:bg-slate-50
               transition"
      >

        <!-- Name -->
        <td class="px-4 py-4">

          <div class="flex items-center gap-3 min-w-0">

            <div
              class="w-9 h-9
                     rounded-full
                     bg-emerald-100
                     flex items-center justify-center
                     shrink-0"
            >
              <i class="fa-solid fa-user text-emerald-600 text-sm"></i>
            </div>

            <span
              class="text-sm
                     font-sans
                     font-semibold
                     text-slate-800"
            >
              {{ student.studentName }}
            </span>

          </div>

        </td>


        <!-- Phone -->
        <td class="px-3 py-4 whitespace-nowrap">

          <span
            class="text-sm
                   font-sans
                   font-semibold
                   text-slate-700"
          >
            {{ student.studentPhoneNo }}
          </span>

        </td>


        <!-- Checkbox -->
        <td class="px-2 py-4">

          <div class="flex justify-center">

            <input
              type="checkbox"
              [(ngModel)]="student.selected"
              name="select{{ student.id }}"
              class="w-[18px] h-[18px]
                     accent-emerald-600
                     cursor-pointer"
            />

          </div>

        </td>

      </tr>

    </tbody>

  </table>

</div>

          <!-- ================= REMOVE BUTTON ================= -->

        <div class="mt-5 d-flex justify-content-center">
  <button
    type="button"
    (click)="deleteSelectedStudents()"
    class="btn btn-outline-danger px-4 rounded-2xl!"
  >
    <i class="fa-solid fa-trash-can me-2"></i>
    Remove Selected Students
  </button>
</div>

        </div>

      </div>

    </div>

  </div>

</section>
